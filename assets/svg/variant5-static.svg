<?xml version="1.0" encoding="UTF-8"?>
<svg id="static-drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="100%" height="100%" role="img" aria-labelledby="static-title static-desc">
  <title id="static-title">Статичний малюнок варіанта 5</title>
  <desc id="static-desc">Два кола, шість прямокутників і ромб синього кольору на осях X та Y. Центри кіл: (-2, 1) і (1, 1), радіус 1. Вершини ромба: (2, -1), (3, 0), (4, -1), (3, -2).</desc>
  <defs>
    <symbol id="static-box" viewBox="0 0 1 1" preserveAspectRatio="none">
      <rect width="1" height="1" />
    </symbol>
    <marker id="static-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 3 L0 6 Z" fill="black" />
    </marker>
  </defs>
  <g id="static-shapes" transform="translate(290 245) scale(72 -72)" fill="#0000ff" stroke="black" stroke-width="0.025">
    <circle id="static-left-circle" data-figure="left-circle" cx="-2" cy="1" r="1" />
    <circle id="static-right-circle" data-figure="right-circle" cx="1" cy="1" r="1" />
    <use id="static-left-bar" data-figure="left-bar" href="#static-box" x="-3" y="-1" width="2" height="1" />
    <use id="static-top-box" data-figure="top-box" href="#static-box" x="2" y="1" width="1" height="1" />
    <use id="static-step-box" data-figure="step-box" href="#static-box" x="3" y="0" width="1" height="1" />
    <use id="static-bottom-left-box" data-figure="bottom-left-box" href="#static-box" x="0" y="-2" width="1" height="1" />
    <use id="static-bottom-bar" data-figure="bottom-bar" href="#static-box" x="1" y="-3" width="2" height="1" />
    <use id="static-bottom-right-box" data-figure="bottom-right-box" href="#static-box" x="4" y="-2" width="1" height="1" />
    <polygon id="static-diamond" data-figure="diamond" points="2,-1 3,0 4,-1 3,-2" />
  </g>
  <g id="static-axes" fill="none" stroke="black" stroke-width="2">
    <line x1="38" y1="245" x2="736" y2="245" marker-end="url(#static-arrow)" />
    <line x1="290" y1="493" x2="290" y2="35" marker-end="url(#static-arrow)" />
    <line x1="74" y1="235" x2="74" y2="255" />
    <line x1="146" y1="235" x2="146" y2="255" />
    <line x1="218" y1="235" x2="218" y2="255" />
    <line x1="362" y1="235" x2="362" y2="255" />
    <line x1="434" y1="235" x2="434" y2="255" />
    <line x1="506" y1="235" x2="506" y2="255" />
    <line x1="578" y1="235" x2="578" y2="255" />
    <line x1="650" y1="235" x2="650" y2="255" />
    <line x1="280" y1="461" x2="300" y2="461" />
    <line x1="280" y1="389" x2="300" y2="389" />
    <line x1="280" y1="317" x2="300" y2="317" />
    <line x1="280" y1="173" x2="300" y2="173" />
    <line x1="280" y1="101" x2="300" y2="101" />
  </g>
  <g fill="black" font-family="Times New Roman, serif" font-size="23">
    <text x="748" y="274">X</text>
    <text x="310" y="45">Y</text>
    <text x="278" y="274" text-anchor="end">0</text>
    <text x="74" y="274" text-anchor="middle">-3</text>
    <text x="218" y="274" text-anchor="middle">-1</text>
    <text x="362" y="274" text-anchor="middle">1</text>
    <text x="434" y="274" text-anchor="middle">2</text>
    <text x="506" y="274" text-anchor="middle">3</text>
    <text x="578" y="274" text-anchor="middle">4</text>
    <text x="650" y="274" text-anchor="middle">5</text>
    <text x="277" y="469" text-anchor="end">-3</text>
    <text x="277" y="397" text-anchor="end">-2</text>
    <text x="277" y="325" text-anchor="end">-1</text>
    <text x="277" y="181" text-anchor="end">1</text>
    <text x="277" y="109" text-anchor="end">2</text>
  </g>
</svg>
